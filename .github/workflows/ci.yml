name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE: ghcr.io/${{ github.repository_owner }}/heart-disease-api
  MLFLOW_DISABLE_TELEMETRY: "true"

# Every action is pinned to a full commit SHA (version in the comment). Tags can be moved
# by whoever controls the action repo, as happened in the 2026 trivy-action compromise;
# a SHA cannot.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.1
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt -e .
      - name: Unit tests
        run: pytest -vv --junitxml=test-results/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/

  train:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt -e .
      - name: Acquire and clean data
        run: python -m heart.data
      - name: Data unchanged vs committed copy
        run: git diff --exit-code data/processed/heart_clean.csv
      - name: EDA
        run: python -m heart.eda
      - name: Train, tune and track (MLflow)
        run: python -m heart.train 2>&1 | tee train.log
      - name: Model quality gate
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("models/model_meta.json"))["metrics"]
          print(json.dumps(m, indent=2))
          gates = {"cv_roc_auc": 0.85, "test_roc_auc": 0.85, "test_recall": 0.80}
          failed = {k: m[k] for k, t in gates.items() if m[k] < t}
          if failed:
              sys.exit(f"Quality gate failed: {failed} (thresholds {gates})")
          print("Quality gate passed")
          EOF
      - name: Upload model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model
          path: models/
      - name: Upload MLflow store, reports and logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlflow-and-reports
          path: |
            mlflow.db
            mlruns/
            reports/
            train.log

  docker:
    needs: train
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the model trained in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model
          path: models/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: heart-disease-api:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: ./scripts/docker_smoke_test.sh --no-build 2>&1 | tee docker_smoke.txt
      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-smoke-test
          path: docker_smoke.txt
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          IMG=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag heart-disease-api:1.0.0 "$IMG:${GITHUB_SHA::7}"
          docker tag heart-disease-api:1.0.0 "$IMG:latest"
          docker push "$IMG:${GITHUB_SHA::7}"
          docker push "$IMG:latest"

  deploy:
    # Kubernetes (minikube) deployment + Prometheus/Grafana monitoring, with evidence.
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python deps and headless Chromium
        run: |
          pip install -r requirements.txt -e . playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Use the model trained in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model
          path: models/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (layers come from the docker job's cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: heart-disease-api:1.0.0
          cache-from: type=gha
      - name: Install minikube (checksum-verified)
        run: |
          curl -sSLo minikube https://github.com/kubernetes/minikube/releases/download/v1.37.0/minikube-linux-amd64
          echo "d5cf561c71171152ff67d799f041ac0f65c235c87a1e9fc02a6a17b8226214d0  minikube" | sha256sum -c -
          sudo install minikube /usr/local/bin/minikube && rm minikube
          minikube version
          kubectl version --client
      - name: Deploy to Kubernetes and collect evidence
        run: ./scripts/ci_deploy.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all -A || true
          kubectl -n heart describe pods || true
          kubectl -n monitoring describe pods || true
          kubectl -n heart logs deploy/heart-api --tail=50 || true
          kubectl -n monitoring logs deploy/grafana --tail=50 || true
          kubectl -n monitoring logs deploy/prometheus --tail=50 || true
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-evidence
          path: deploy-evidence/
