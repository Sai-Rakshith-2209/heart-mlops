# Lets Prometheus (namespace: monitoring) discover pods in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus-sd, namespace: heart}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus-sd, namespace: heart}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-sd}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: monitoring}
