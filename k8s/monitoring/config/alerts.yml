groups:
  - name: heart-api
    rules:
      - alert: HeartApiDown
        expr: sum(up{pod=~"heart-api.*"} or up{job="heart-api"}) == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "No heart-api replica is being scraped"}
      - alert: HeartApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "More than 5% of requests are failing"}
      - alert: HeartApiSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{route="/predict"}[5m]))) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "p95 /predict latency above 500 ms"}
