apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - monitoring.yaml
configMapGenerator:
  - name: prometheus-config
    files: [config/prometheus.yml, config/alerts.yml]
  - name: grafana-provisioning
    files:
      - datasource.yaml=config/grafana-datasource.yaml
      - dashboards.yaml=config/grafana-dashboards.yaml
  - name: grafana-dashboards
    files: [config/heart-api-dashboard.json]
